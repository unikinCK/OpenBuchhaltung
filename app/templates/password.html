{% extends "base.html" %}

{% block title %}Passwort ändern – OpenBuchhaltung{% endblock %}

{% block content %}
  <h1 class="page-title">Passwort ändern</h1>

  <section class="card">
    <p class="muted">Das neue Passwort muss mindestens 8 Zeichen lang sein.</p>
    <form method="post" action="{{ url_for('auth.change_password') }}" class="stacked">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />

      <label for="current_password">Aktuelles Passwort</label>
      <input id="current_password" name="current_password" type="password"
             autocomplete="current-password" required autofocus />

      <label for="new_password">Neues Passwort</label>
      <input id="new_password" name="new_password" type="password"
             autocomplete="new-password" minlength="8" required />

      <label for="confirm_password">Neues Passwort wiederholen</label>
      <input id="confirm_password" name="confirm_password" type="password"
             autocomplete="new-password" minlength="8" required />

      <button type="submit">Passwort ändern</button>
    </form>
  </section>
{% endblock %}
