    <circle cx="99" cy="135" r="18" fill="#ffffff" stroke="#16344a" stroke-width="5"/>
    <circle cx="157" cy="135" r="18" fill="#ffffff" stroke="#16344a" stroke-width="5"/>
    <circle cx="104" cy="139" r="5.5" fill="#16344a"/>
    <circle cx="162" cy="137" r="5.5" fill="#16344a"/>
    <path d="M88 127 Q92 122 98 121" fill="none" stroke="#c9d6e0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M146 127 Q150 122 156 121" fill="none" stroke="#c9d6e0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Schmallippiger Mund -->
    <path d="M112 166 Q128 161 144 166" fill="none" stroke="#16344a" stroke-width="4.5" stroke-linecap="round"/>
