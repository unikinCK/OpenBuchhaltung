    <g fill="none" stroke="#7db8e3" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.7">
      <path d="M50 214 L96 264 M82 214 L52 248"/>
      <path d="M206 214 L160 264 M174 214 L204 248"/>
    </g>

    <!-- Hemd, Kragen, Krawatte -->
    <path d="M100 196 L128 240 L156 196 Z" fill="#eef4f8"/>
    <g clip-path="url(#obi-icon-shirt)">
