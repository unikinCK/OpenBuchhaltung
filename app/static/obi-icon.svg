    <path d="M100 196 L116 214 L124 200 Z M156 196 L140 214 L132 200 Z" fill="#ffffff" stroke="#c9d6e0" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M100 196 L128 240 L156 196" fill="none" stroke="#174868" stroke-width="5" stroke-linejoin="round"/>

    <!-- Hals -->
    <rect x="112" y="176" width="32" height="22" rx="4" fill="#c9d6e0"/>

    <!-- Bleistift hinterm Ohr -->
    <g transform="translate(202 112) rotate(24)">
      <rect x="-6" y="-44" width="12" height="9" rx="2" fill="#ff8a7d"/>
      <rect x="-6" y="-36" width="12" height="4" fill="#c9d6e0"/>
      <rect x="-6" y="-32" width="12" height="52" fill="#f4c95d"/>
      <path d="M-6 20 L6 20 L0 34 Z" fill="#e8c39e"/>
      <path d="M-2.2 29 L2.2 29 L0 34 Z" fill="#16344a"/>
    </g>

    <!-- Antenne als i-Punkt -->
    <path d="M128 72 V44" stroke="#c9d6e0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="128" cy="36" r="10" fill="#ff8a7d"/>

    <!-- Ohren -->
    <rect x="52" y="118" width="16" height="34" rx="6" fill="#c9d6e0"/>
    <rect x="188" y="118" width="16" height="34" rx="6" fill="#c9d6e0"/>

    <!-- Kopf -->
    <rect x="64" y="72" width="128" height="112" rx="48" fill="#eef4f8"/>

    <!-- Gescheitelte Frisur -->
    <g clip-path="url(#obi-icon-head)">
      <path d="M56 60 H200 V116 C192 102 176 96 154 96 H108 C88 96 70 102 56 114 Z" fill="#0d2233"/>
      <path d="M98 70 C100 80 102 88 104 97" fill="none" stroke="#eef4f8" stroke-width="3.5" stroke-linecap="round"/>
      <g fill="none" stroke="#2c4f69" stroke-width="2.2" stroke-linecap="round">
