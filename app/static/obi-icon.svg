    <path d="M84 113 L112 116" stroke="#16344a" stroke-width="5" stroke-linecap="round"/>
    <path d="M144 112 Q158 101 174 107" fill="none" stroke="#16344a" stroke-width="5" stroke-linecap="round"/>

