<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="obi-icon-title">
  <title id="obi-icon-title">Obi – der KI-Buchhalter</title>
  <defs>
    <clipPath id="obi-icon-frame">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
    <clipPath id="obi-icon-head">
      <rect x="64" y="72" width="128" height="112" rx="48"/>
    </clipPath>
    <clipPath id="obi-icon-shirt">
      <path d="M100 196 L128 240 L156 196 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#obi-icon-frame)">
